#
# Microchip PIC32CK family (Cortex-M33)
# Covers PIC32CK GC/SG variants: 0512, 1025, 2051 KB flash
#
# On-chip debug uses SWD (CMSIS-DAP) only.
#

transport select swd

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME pic32ck
}

# Work-area in SRAM for flash programming.
# PIC32CK devices have at least 64 KB SRAM; use 32 KB by default.
if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x8000
}

# Cortex-M33 JTAG/SWD DP ID
# PIC32CK uses an ARM CoreSight DP; the standard M33 SWD-DP IDCODE is
# 0x6ba02477 (r0p2). Override via CPUTAPID if your variant differs.
if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    set _CPUTAPID 0x6ba02477
}

if { [info exists APNUM] } {
    set _APNUM $APNUM
} else {
    set _APNUM 0
}

swd newdap $_CHIPNAME cpu -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create $_CHIPNAME.ap0 mem_ap -dap $_CHIPNAME.dap -ap-num 0
target create $_CHIPNAME.ap1 mem_ap -dap $_CHIPNAME.dap -ap-num 1

set _TARGETNAME $_CHIPNAME.cpu
# Select the MEM-AP explicitly, but defer Cortex-M examination so startup does
# not fail before raw DSU access can be tested.
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num $_APNUM -coreid 0 -defer-examine

proc pic32ck_dsu_status {{apnum ""}} {
    if {$apnum eq ""} {
        set apnum $::_APNUM
    }

    set target_name [format "%s.ap%d" $::_CHIPNAME $apnum]
    if {[catch {$target_name arp_examine} err]} {
        error [format "AP%d examine failed: %s" $apnum $err]
    }

    set did [$target_name read_memory 0x44000120 32 1]
    set dal [$target_name read_memory 0x44000124 32 1]
    set cpu0_dal [expr {$dal & 0x3}]

    echo [format "PIC32CK AP%d DSU DID=0x%08x DAL=0x%08x CPU0_DAL=%d" $apnum $did $dal $cpu0_dal]
    return $dal
}

proc pic32ck_try_aps {} {
    foreach apnum {0 1} {
        if {![catch {pic32ck_dsu_status $apnum} msg]} {
            echo [format "PIC32CK: AP%d can access DSU. Re-run with: -c \"set APNUM %d\"" $apnum $apnum]
            return $apnum
        }
        echo $msg
    }

    error "Neither AP0 nor AP1 could access the PIC32CK DSU"
}

proc pic32ck_chip_erase {{apnum ""}} {
    if {$apnum eq ""} {
        set apnum [pic32ck_try_aps]
    }

    set target_name [format "%s.ap%d" $::_CHIPNAME $apnum]
    set dal [pic32ck_dsu_status $apnum]
    set cpu0_dal [expr {$dal & 0x3}]

    echo [format "PIC32CK: requesting DSU chip erase on AP%d" $apnum]

    set dsu_statusa 0x44000100
    set dsu_statusb 0x44000104
    set dsu_statusc 0x44000108

    set statusa0 [$target_name read_memory $dsu_statusa 32 1]
    set statusb0 [$target_name read_memory $dsu_statusb 32 1]
    set statusc0 [$target_name read_memory $dsu_statusc 32 1]
    echo [format "PIC32CK DSU pre-erase STATUSA=0x%08x STATUSB=0x%08x STATUSC=0x%08x" $statusa0 $statusb0 $statusc0]

    # Experimental: on related Microchip Cortex-M devices the secure erase
    # trigger is a BYTE write of bit4 to DSU external control/status window.
    # Use byte access first; word writes may be ignored on this alias.
    if {[catch {$target_name write_memory 0x44000100 8 0x10} err]} {
        error [format "PIC32CK DSU chip erase trigger write failed on AP%d: %s" $apnum $err]
    }

    set timeout 10000
    set step 100
    set loops 0
    set statusa 0
    while {$timeout > 0} {
        set statusa [$target_name read_memory $dsu_statusa 32 1]
        set statusb [$target_name read_memory $dsu_statusb 32 1]
        set statusc [$target_name read_memory $dsu_statusc 32 1]

        # If no state transition after first second, retry with word write.
        # Some DSU aliases ignore byte writes.
        if {$timeout == 9000 && $statusa == $statusa0 && $statusb == $statusb0 && $statusc == $statusc0} {
            catch {$target_name mww 0x44000100 0x00000010}
            echo "PIC32CK DSU: no transition after byte trigger, retried with word trigger"
        }

        if {($statusa & 0x1) != 0} {
            if {($statusa & 0xE) != 0} {
                error [format "PIC32CK DSU chip erase completed with STATUSA=0x%08x" $statusa]
            }

            # Release CPU0 reset phase extension once the erase finishes.
            catch {$target_name mww 0x44000100 0x00000100}
            set dal_after [$target_name read_memory 0x44000124 32 1]
            echo [format "PIC32CK chip erase finished, DAL=0x%08x CPU0_DAL=%d" $dal_after [expr {$dal_after & 0x3}]]

            if {$cpu0_dal == 0 && (($dal_after & 0x3) == 0)} {
                echo "PIC32CK: DAL still reports secured. Power-cycle or issue a hardware reset, then retry pic32ck_recover."
            }
            return
        }

        if {[expr {$loops % 10}] == 0} {
            echo [format "PIC32CK DSU chip erase in progress, STATUSA=0x%08x STATUSB=0x%08x STATUSC=0x%08x" $statusa $statusb $statusc]
        }

        sleep $step
        set timeout [expr {$timeout - $step}]
        set loops [expr {$loops + 1}]
    }

    if {$statusa == $statusa0 && $statusb == $statusb0 && $statusc == $statusc0} {
        error [format "PIC32CK DSU chip erase command was not accepted (STATUSA/B/C unchanged: 0x%08x/0x%08x/0x%08x). This silicon likely requires a BootROM BCC secure-erase command sequence not implemented in this script yet." $statusa $statusb $statusc]
    }

    error [format "PIC32CK DSU chip erase timed out waiting for STATUSA.DONE (last STATUSA=0x%08x STATUSB=0x%08x STATUSC=0x%08x)" $statusa $statusb $statusc]
}

proc pic32ck_recover {} {
    set apnum [pic32ck_try_aps]

    set dal [pic32ck_dsu_status $apnum]
    if {($dal & 0x3) == 0} {
        error [format "PIC32CK CPU0 is secured (DAL=0x%08x). Run 'pic32ck_chip_erase %d' first, then power-cycle/reset and retry." $dal $apnum]
    }

    if {$apnum != $::_APNUM} {
        error [format "PIC32CK DSU is reachable via AP%d, but the Cortex-M target is configured for AP%d. Re-run OpenOCD with: -c \"set APNUM %d\" before -f target/pic32ck.cfg" $apnum $::_APNUM $apnum]
    }

    targets $::_TARGETNAME

    if {[catch {$::_TARGETNAME arp_examine} err]} {
        error [format "PIC32CK core examine failed on AP%d after DSU access. Check DAL state above, connect-under-reset wiring, and security configuration. Root error: %s" $apnum $err]
    }

    if {[catch {halt} err]} {
        error [format "PIC32CK core examine succeeded on AP%d, but halt failed: %s" $apnum $err]
    }

	if {[catch {reset init} err]} {
		echo [format "PIC32CK: reset init failed after core examine: %s" $err]
	}

    echo [format "PIC32CK recovery succeeded on AP%d" $apnum]
}

# SRAM starts at 0x20000000 on all PIC32CK variants
$_TARGETNAME configure \
    -work-area-phys 0x20000000 \
    -work-area-size $_WORKAREASIZE \
    -work-area-backup 0

# Use sysresetreq (AIRCR) for reset when no physical SRST line is wired.
# Overriding with vectreset is NOT valid on Cortex-M33.
if { ![using_hla] } {
    cortex_m reset_config sysresetreq
}

# Assume no SRST line is connected; fall back to software reset only.
# If your board does wire SRST, change this to: reset_config srst_nogate
reset_config srst_push_pull

# After reset the chip runs from its internal 12 MHz RC oscillator.
# Keep adapter speed well below SYSCLK/10. 2 MHz is conservative
# and reliable across all PIC32CK devices.
adapter speed 2000

# Program flash (PFM) is at 0x0C000000 on all PIC32CK variants.
# Length is 0 to let the driver auto-detect size from the DID register.
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME pic32ck 0x0C000000 0 0 0 $_TARGETNAME

targets $_TARGETNAME
